<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}Clipplex{% endblock %}</title>
    <link rel="icon" type="image/png" href="/static/icons/clipplex_icon.png" />
    <link href="/static/css/styles.css" rel="stylesheet" />
    <script src="/static/js/all.min.js" crossorigin="anonymous"></script>
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="/instant_video.html">
        <img src="/static/icons/clipplex_icon.png" width="32" height="32" alt="" />
        <span>Clipplex</span>
      </a>
      <nav class="topnav">
        <a href="/instant_video.html" class="{{ 'active' if active_page == 'video' }}">
          <i class="fas fa-hand-scissors"></i><span>Clips</span>
        </a>
        <a href="/instant_snapshot.html" class="{{ 'active' if active_page == 'snapshot' }}">
          <i class="fas fa-camera-retro"></i><span>Snapshots</span>
        </a>
      </nav>
    </header>

    <main class="page">
      {% block content %}{% endblock %}
    </main>

    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

    <div id="overlay" class="overlay" hidden>
      <div class="spinner"></div>
      <p id="overlay-text">Working…</p>
    </div>

    <script>
      // opts.html keeps markup (used for the Streamable link); opts.sticky
      // leaves the toast up until it is dismissed, so a URL can't vanish
      // while it is still being read.
      function showToast(message, kind, opts) {
        opts = opts || {};
        const el = document.getElementById("toast");
        el.innerHTML = "";

        const body = document.createElement("div");
        body.className = "toast-body";
        if (opts.html) {
          body.appendChild(message);
        } else {
          body.textContent = message;
        }
        el.appendChild(body);

        const close = document.createElement("button");
        close.className = "toast-close";
        close.type = "button";
        close.setAttribute("aria-label", "Dismiss");
        close.innerHTML = '<i class="fas fa-times"></i>';
        close.onclick = () => { el.hidden = true; };
        el.appendChild(close);

        el.className = "toast" + (kind ? " toast--" + kind : "");
        el.hidden = false;
        clearTimeout(el._timer);
        if (!opts.sticky) {
          el._timer = setTimeout(() => { el.hidden = true; }, 8000);
        }
      }

      function showOverlay(text) {
        document.getElementById("overlay-text").textContent = text || "Working…";
        document.getElementById("overlay").hidden = false;
      }

      function hideOverlay() {
        document.getElementById("overlay").hidden = true;
      }
    </script>
    {% block scripts %}{% endblock %}
  </body>
</html>
